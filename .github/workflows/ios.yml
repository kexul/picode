name: ios

# 打一个没签名的 iOS 包（ios/build/PiChat.ipa），当成 artifact 下下来。
# 这台机器是 Windows、编不了 iOS，所以交给 GitHub 的 macOS 机器干（见 ios/README.md）。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    # 用 Intel 那台（macos-14 是 arm64，有些账号的 runner 组不认那个配置：
    # The configuration 'macos-14-arm64-us-default' is not supported）
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: 打 ipa
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PiChat-ipa
          path: ios/build/PiChat.ipa
          if-no-files-found: error
