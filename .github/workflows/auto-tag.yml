name: Auto Tag

# 当 package.json 的 version 变化时自动打 v{version} tag，
# 进而触发 release.yml 构建 VSIX 并发布到 GitHub Release。
on:
  push:
    branches:
      - master
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    # 只在 GitHub 仓库本身上跑（fork / 内部镜像不会重复触发）
    if: github.repository == 'kexul/picode'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 需要上一条 commit 来比对 version 变化

      - name: Detect version change
        id: ver
        run: |
          CUR=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || echo "")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if unchanged
        if: steps.ver.outputs.changed != 'true'
        run: echo "version 未变化（${{ steps.ver.outputs.previous }} -> ${{ steps.ver.outputs.current }}），跳过"

      - name: Create tag
        if: steps.ver.outputs.changed == 'true'
        run: |
          v="${{ steps.ver.outputs.current }}"
          tag="v${v}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} 已存在，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"
