name: Release

# 当 package.json 的 version 变化时：
# 自动打 v{version} tag，构建 VSIX，并发布到 GitHub Release。
# 一个 workflow 内串行完成，避免 tag 推送的递归触发问题。
on:
  push:
    branches:
      - master
    paths:
      - "package.json"
  # 兼容手动触发，便于测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'kexul/picode'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 需要上一条 commit 来比对 version 变化

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect version change
        id: ver
        run: |
          CUR=$(node -p "require('./package.json').version")
          # workflow_dispatch 时无上一条 commit，按“有变化”处理
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "current=$CUR" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || echo "")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if version unchanged
        if: steps.ver.outputs.changed != 'true'
        run: |
          echo "version 未变化（${{ steps.ver.outputs.previous }} -> ${{ steps.ver.outputs.current }}），跳过"
          exit 0

      - name: Create tag (if not exists)
        if: steps.ver.outputs.changed == 'true'
        run: |
          v="${{ steps.ver.outputs.current }}"
          tag="v${v}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} 已存在，跳过打 tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"

      - name: Install dependencies
        if: steps.ver.outputs.changed == 'true'
        run: npm install

      - name: Compile TypeScript
        if: steps.ver.outputs.changed == 'true'
        run: npx tsc -p ./

      - name: Package VSIX
        if: steps.ver.outputs.changed == 'true'
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload VSIX to Release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.current }}"
          tag="v${v}"
          vsix=$(ls *.vsix | head -1)
          # Release 已存在则上传到现有 Release，否则创建
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${vsix}" --clobber
          else
            gh release create "${tag}" "${vsix}" --title "${tag}" --generate-notes
          fi
