<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
<title>文件查看器</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    font-size: 13px; color: #24292e; background: #ffffff; display: flex; flex-direction: column;
  }
  #head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid #e5e5e5; font-size: 12px; background: #f3f3f3;
  }
  #path { flex: 1; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
  #content { flex: 1; overflow: auto; }
  table { display: block; width: max-content; min-width: 100%; }
  tr { display: flex; }
  td.ln {
    flex: 0 0 3.5em; display: block; padding: 0 8px; text-align: right;
    color: #afb3b9; user-select: none; border-right: 1px solid #e5e5e5; background: #fafafa;
  }
  td.code { display: block; padding: 0 10px; white-space: pre; }
  tr.target { background: rgba(255, 213, 79, 0.28); }
  tr.target td.ln { background: rgba(255, 213, 79, 0.4); color: #8a6d00; font-weight: bold; }
  .hljs { color: #24292e; background: none; }
  .hljs-keyword,.hljs-meta .hljs-keyword,.hljs-type { color: #d73a49; }
  .hljs-title,.hljs-title.function_ { color: #6f42c1; }
  .hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,.hljs-variable { color: #005cc5; }
  .hljs-string,.hljs-regexp { color: #032f62; }
  .hljs-built_in,.hljs-symbol { color: #005cc5; }
  .hljs-comment { color: #6a737d; font-style: italic; }
  .hljs-name,.hljs-selector-tag { color: #22863a; }
  .empty { padding: 40px; text-align: center; opacity: 0.5; }
</style>
</head>
<body>
  <div id="head"><span id="path"></span><span id="meta" style="opacity:0.6"></span></div>
  <div id="content"><div class="empty">加载中…</div></div>
  <script>
    const { ipcRenderer } = require("electron");
    const fs = require("fs");
    const path = require("path");

    const params = new URLSearchParams(location.search);
    const filePath = params.get("path") || "";
    const targetLine = parseInt(params.get("line") || "1", 10);
    const anchor = params.get("anchor") || "";

    document.getElementById("path").textContent = filePath;
    document.title = path.basename(filePath);

    const EXT_LANG = {
      js:"javascript",jsx:"javascript",mjs:"javascript",cjs:"javascript",
      ts:"typescript",tsx:"typescript",mts:"typescript",cts:"typescript",
      py:"python",cpp:"cpp",cc:"cpp",cxx:"cpp",h:"cpp",hpp:"cpp",
      java:"java",go:"go",rs:"rust",rb:"ruby",php:"php",sh:"bash",
      json:"json",xml:"xml",html:"xml",css:"css",scss:"scss",less:"less",
      md:"markdown",yml:"yaml",yaml:"yaml",sql:"sql",c:"c",cs:"csharp",
    };
    function langOf(p) { return EXT_LANG[(p.split(".").pop() || "").toLowerCase()]; }
    function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    function render(text) {
      const lang = langOf(filePath);
      const lines = text.split("\n");
      const tbl = document.createElement("table");
      lines.forEach((line, i) => {
        const tr = document.createElement("tr");
        if (i + 1 === targetLine) tr.classList.add("target");
        const ln = document.createElement("td"); ln.className = "ln"; ln.textContent = String(i + 1);
        const code = document.createElement("td"); code.className = "code";
        if (lang && window.hljsBundle && window.hljsBundle.hljs) {
          try { code.innerHTML = window.hljsBundle.hljs.highlight(line || " ", { language: lang }).value; }
          catch { code.textContent = line; }
        } else { code.textContent = line; }
        tr.appendChild(ln); tr.appendChild(code); tbl.appendChild(tr);
      });
      const content = document.getElementById("content");
      content.innerHTML = ""; content.appendChild(tbl);
      document.getElementById("meta").textContent = (lang ? lang + " · " : "") + lines.length + " 行";
      const t = tbl.querySelector("tr.target");
      if (t) t.scrollIntoView({ block: "center" });
    }

    ipcRenderer.on("fv:goto", (_e, { line, anchor }) => {
      const rows = document.querySelectorAll("#content table tr");
      if (anchor) {
        for (const row of rows) {
          if (row.textContent.replace(/^\d+\s*/, "").startsWith(anchor)) {
            rows.forEach(r => r.classList.remove("target"));
            row.classList.add("target"); row.scrollIntoView({ block: "center" }); return;
          }
        }
      }
      const idx = Math.max(0, Math.min(rows.length - 1, line - 1));
      rows.forEach(r => r.classList.remove("target"));
      if (rows[idx]) { rows[idx].classList.add("target"); rows[idx].scrollIntoView({ block: "center" }); }
    });

    try { render(fs.readFileSync(filePath, "utf8")); }
    catch (e) {
      document.getElementById("content").innerHTML =
        '<div class="empty">无法读取文件：' + escapeHtml(String(e.message || e)) + "</div>";
    }
  </script>
</body>
</html>
