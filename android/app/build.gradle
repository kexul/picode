plugins {
    id 'com.android.application'
}

// 什么都不引：界面是原生控件，长连接用 HttpURLConnection 读流，通知用系统的。
android {
    namespace 'dev.pichat.phone'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.pichat.phone'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
